<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmosphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Layer 0: Particles -->
    <canvas id="particle-canvas"></canvas>

    <!-- Layer 1: Weather Gradient Overlay -->
    <div id="weather-overlay"></div>

    <!-- Layer 2: App -->
    <div id="app">
        <header>
            <div class="logo">
                <div class="logo-icon">☁️</div>
                <span class="logo-text">Atmosphere</span>
            </div>

            <div class="search-wrap">
                <span class="search-icon">
                    <svg id="search-glass" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    <svg id="search-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="Search for a city..." autocomplete="off"
                    spellcheck="false" />
                <button class="search-clear" id="search-clear" aria-label="Clear">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round">
                        <path d="M18 6 6 18M6 6l12 12" />
                    </svg>
                </button>
                <div class="search-dropdown" id="search-dropdown">
                    <div class="dropdown-msg" id="dropdown-msg"></div>
                    <ul id="results-list"></ul>
                </div>
            </div>

            <div class="unit-toggle">
                <div class="toggle-track" id="toggle-track"></div>
                <button class="unit-btn active" id="btn-c">°C</button>
                <button class="unit-btn" id="btn-f">°F</button>
            </div>
        </header>

        <div id="loading-state">
            <div class="spinner"></div>
            <p class="loading-text">Reading the skies…</p>
        </div>

        <div id="error-state">
            <div style="font-size:2.5rem">📍</div>
            <h2 style="color:var(--text);font-size:1.25rem;font-weight:700">Weather unavailable</h2>
            <p id="error-msg" style="max-width:28rem;text-align:center;font-size:0.9rem"></p>
        </div>

        <main id="main-content">
            <div class="left-col">
                <div class="glass" id="current-card">
                    <div class="orb orb-1"></div>
                    <div class="orb orb-2"></div>
                    <div class="current-inner">
                        <div>
                            <div id="city-name">—</div>
                            <div id="current-time">—</div>
                            <div class="temp-row">
                                <span id="current-temp">—</span>
                                <div class="condition-info">
                                    <div class="condition-line">
                                        <span id="condition-icon"></span>
                                        <span id="condition-text"></span>
                                    </div>
                                    <div id="feels-like">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z" />
                                        </svg>
                                        Feels like <span id="feels-val">—</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-icon wind">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2" />
                                        <path d="M9.6 4.6A2 2 0 1 1 11 8H2" />
                                        <path d="M12.6 19.4A2 2 0 1 0 14 16H2" />
                                    </svg>
                                </div>
                                <div>
                                    <div class="stat-label">Wind speed</div>
                                    <div class="stat-value"><span id="wind-speed">—</span> <span
                                            class="stat-unit">km/h</span></div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon humidity">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path
                                            d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" />
                                    </svg>
                                </div>
                                <div>
                                    <div class="stat-label">Humidity</div>
                                    <div class="stat-value"><span id="humidity">—</span>%</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass" id="hourly-card">
                    <div class="section-title">
                        <div class="pulse-dot"></div>
                        Today's Forecast
                    </div>
                    <div class="hourly-scroll" id="hourly-list"></div>
                </div>
            </div>

            <div class="glass" id="daily-card">
                <div class="section-title">7-Day Forecast</div>
                <div id="daily-list"></div>
            </div>
        </main>

        <footer>
            <p style="color: #fff; ">&copy Made by Ranajoy Dutta</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
